version: "3"

services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.yourdomain.com}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST:-n8n.yourdomain.com}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Jerusalem}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      - N8N_LOG_LEVEL=info
      - EXECUTIONS_MODE=regular
      - N8N_BASIC_AUTH_ACTIVE=false
    volumes:
      - ~/.n8n:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
